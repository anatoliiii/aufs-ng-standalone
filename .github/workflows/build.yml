name: Build AUFS module

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        kernel:
          - name: linux-6.17-aya
            id: linux-6.17-aya
            archive: 'https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.17.3.tar.xz'
            config: defconfig
            patches: 'ci/patches/localversion-aya617.patch'
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc flex bison libssl-dev libelf-dev dwarves \
            clang lld rsync cpio kmod wget xz-utils patch

      - name: Build module
        env:
          ARTIFACT_ROOT: ${{ github.workspace }}/artifacts
          KERNEL_ID: ${{ matrix.kernel.id }}
          COMPILER: ${{ matrix.compiler }}
          KERNEL_CONFIG: ${{ matrix.kernel.config }}
          KERNEL_ARCHIVE_CANDIDATES: ${{ matrix.kernel.archive }}
          KERNEL_PATCHES: ${{ matrix.kernel.patches }}
        run: |
          ci/build-module.sh | tee build-${{ matrix.kernel.id }}-${{ matrix.compiler }}.log

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: aufs-${{ matrix.kernel.id }}-${{ matrix.compiler }}
          path: |
            artifacts/${{ matrix.kernel.id }}/${{ matrix.compiler }}/aufs.ko
            artifacts/${{ matrix.kernel.id }}/${{ matrix.compiler }}/build.json
            build-${{ matrix.kernel.id }}-${{ matrix.compiler }}.log
