name: Build AUFS module

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        kernel:
          - name: linux-6.1
            id: linux-6.1
            archive: 'https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.1.tar.xz'
            config: defconfig
          - name: linux-6.6
            id: linux-6.6
            archive: 'https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.1.tar.xz'
            config: defconfig
          - name: linux-6.10
            id: linux-6.10
            archive: 'https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.10.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/testing/linux-6.10-rc7.tar.xz'
            config: defconfig
          - name: linux-6.12-rc
            id: linux-6.12-rc
            archive: 'https://cdn.kernel.org/pub/linux/kernel/v6.x/testing/linux-6.12-rc2.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/testing/linux-6.12-rc1.tar.xz'
            config: defconfig
          - name: linux-6.14-atlant
            id: linux-6.14-atlant
            archive: 'https://cdn.kernel.org/pub/linux/kernel/v6.x/testing/linux-6.14-rc1.tar.xz https://cdn.kernel.org/pub/linux/kernel/next/linux-next.tar.xz'
            config: defconfig
            patches: 'ci/patches/localversion-atlant.patch'
          - name: linux-6.17-aya
            id: linux-6.17-aya
            archive: 'https://cdn.kernel.org/pub/linux/kernel/next/linux-next.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/testing/linux-6.17-rc1.tar.xz'
            config: defconfig
            patches: 'ci/patches/localversion-aya617.patch'
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev dwarves clang lld
      - name: Build module
        env:
          ARTIFACT_ROOT: ${{ github.workspace }}/artifacts
          KERNEL_ID: ${{ matrix.kernel.id }}
          COMPILER: ${{ matrix.compiler }}
          KERNEL_CONFIG: ${{ matrix.kernel.config }}
          KERNEL_ARCHIVE_CANDIDATES: ${{ matrix.kernel.archive }}
          KERNEL_GIT_REPO: ${{ matrix.kernel.git_repo || '' }}
          KERNEL_GIT_REF: ${{ matrix.kernel.git_ref || '' }}
          KERNEL_PATCHES: ${{ matrix.kernel.patches || '' }}
        run: |
          ci/build-module.sh | tee build-${{ matrix.kernel.id }}-${{ matrix.compiler }}.log
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: aufs-${{ matrix.kernel.id }}-${{ matrix.compiler }}
          path: |
            artifacts/${{ matrix.kernel.id }}/${{ matrix.compiler }}/aufs.ko
            artifacts/${{ matrix.kernel.id }}/${{ matrix.compiler }}/build.json
            build-${{ matrix.kernel.id }}-${{ matrix.compiler }}.log
